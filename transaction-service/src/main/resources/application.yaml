spring:
  application:
    name: transaction-service
  datasource:
    url: ${TRANSACTIONSDB_URL:jdbc:postgresql://transactions_db:5432/transactions_db}
    username: ${TRANSACTIONSDB_USERNAME:root}
    password: ${TRANSACTIONSDB_PASSWORD:root}
  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    prefer-ip-address: true
  
server:
  port: 0