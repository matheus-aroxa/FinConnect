spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNTSDB_URL:jdbc:postgresql://accounts_db:5432/accounts_db}
    username: ${ACCOUNTSDB_USERNAME:root}
    password: ${ACCOUNTSDB_PASSWORD:root}
  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api/accounts/v3/api-docs
  swagger-ui:
    path: /api/accounts/swagger-ui.html

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    prefer-ip-address: true
  
server:
  port: 0