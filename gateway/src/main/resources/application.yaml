spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth_route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - JwtAuthenticationFilter
        - id: accounts_route
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/accounts/**
          filters:
            - JwtAuthenticationFilter
        - id: transactions_route
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/transactions/**
          filters:
            - JwtAuthenticationFilter

jwt:
  secret: ${JWT_SECRET:f64fefbfe95bfad56f2e81c8218fee610a72906cc1cbe4abc14b6d9684318826}

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: api/auth/v3/api-docs
      - name: account-service
        url: api/accounts/v3/api-docs
      - name: notification-service
        url: v3/api-docs
      - name: transaction-service
        url: api/transactions/v3/api-docs

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
